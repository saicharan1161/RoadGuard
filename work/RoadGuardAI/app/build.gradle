plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.roadguard.ai'
    compileSdk rootProject.ext.versionCompiler

    defaultConfig {
        applicationId 'com.roadguard.ai'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.versionTarget
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionNameString
        ndkVersion rootProject.ext.ndkVersion

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation 'androidx.media3:media3-transformer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { exclude group: 'com.google.zxing', module: 'core' }
    implementation 'com.google.zxing:core:3.3.3'
    implementation project(':libausbc')
    implementation project(':libuvc')
    implementation "androidx.appcompat:appcompat:${androidXVersion}"
    implementation "androidx.core:core-ktx:${coreKtx}"
    implementation "com.google.android.material:material:${materialVersion}"
}
